# Local stack: the API plus a local DynamoDB, so the AWS code path can be
# exercised on a laptop without an AWS account.
#   docker compose up --build        -> http://localhost:8000
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      STORAGE_BACKEND: dynamodb
      DYNAMODB_TABLE: veriframe-ledger
      AWS_REGION: ap-southeast-2
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -inMemory -sharedDb"

  dynamodb-init:
    image: amazon/aws-cli:latest
    depends_on: [dynamodb]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ap-southeast-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        sleep 2 &&
        aws dynamodb create-table --endpoint-url http://dynamodb:8000
        --table-name veriframe-ledger
        --attribute-definitions AttributeName=pk,AttributeType=S
        --key-schema AttributeName=pk,KeyType=HASH
        --billing-mode PAY_PER_REQUEST || true
